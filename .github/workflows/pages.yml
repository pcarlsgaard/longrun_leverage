name: Deploy Leverage Lab to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'reports/site_guided_sensitivity.json'
      - 'reports/leaps_frontier_monte_carlo.csv'
      - 'reports/leaps_frontier_sensitivities.csv'
      - 'reports/price_signal_revision_summary.csv'
      - 'reports/portfolio_metrics.csv'
      - 'reports/leaps_frontier_historical.csv'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'reports/site_guided_sensitivity.json'
      - 'reports/leaps_frontier_monte_carlo.csv'
      - 'reports/leaps_frontier_sensitivities.csv'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Assemble static site
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp -R site/. _site/
          cp reports/site_guided_sensitivity.json _site/data/
          cp reports/leaps_frontier_monte_carlo.csv _site/data/
          cp reports/leaps_frontier_sensitivities.csv _site/data/
          cp reports/leaps_frontier_historical.csv _site/data/
          cp reports/portfolio_metrics.csv _site/data/
          cp reports/price_signal_revision_summary.csv _site/data/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/app.js
          test -s _site/styles.css
          test -s _site/data/site_guided_sensitivity.json
          test -s _site/data/leaps_frontier_monte_carlo.csv
          test -s _site/data/leaps_frontier_sensitivities.csv
          test -s _site/data/leaps_frontier_historical.csv
          test -s _site/data/portfolio_metrics.csv
          test -s _site/data/price_signal_revision_summary.csv
      - name: Validate browser JavaScript
        run: |
          node --check _site/app.js
          node --check _site/compare.js
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
