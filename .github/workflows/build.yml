name: Build time series
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'tests/**', 'scripts/**', 'reports/**', 'pyproject.toml', '.github/workflows/build.yml', 'data/snapshots/**']
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/**', 'reports/**', 'pyproject.toml', '.github/workflows/build.yml', 'data/snapshots/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v

  reproduce:
    # Regenerates every committed result offline and fails if any of them
    # differs. This is what catches a hand-edited generated report, a committed
    # result that no script produces, and a silent numeric drift.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: scripts/check_reproducible.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: longrun-leverage-reports
          path: reports/
          retention-days: 90

  refresh:
    # Only on demand: this one leaves the frozen bundles and hits the network.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: |
          longrun-leverage --refresh
          longrun-leverage-analysis --refresh
          scripts/regenerate.sh
      - uses: actions/upload-artifact@v4
        with:
          name: longrun-leverage-timeseries
          path: |
            data/processed/
            reports/
            config.json
          retention-days: 90
