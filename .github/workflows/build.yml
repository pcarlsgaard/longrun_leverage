name: Build time series
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'tests/**', 'pyproject.toml', '.github/workflows/build.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'pyproject.toml', '.github/workflows/build.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Download sources and generate outputs
        if: github.event_name == 'workflow_dispatch'
        run: longrun-leverage --refresh
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: longrun-leverage-timeseries
          path: |
            data/processed/
            reports/
            config.json
          retention-days: 90
