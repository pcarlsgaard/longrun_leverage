name: Build time series
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'tests/**', 'pyproject.toml', '.github/workflows/build.yml', 'data/snapshots/portfolio_sma_inputs.zip', 'reports/portfolio_sma_manifest.json', 'data/snapshots/sma_price_inputs.zip', 'reports/sma_price_input_manifest.json']
  pull_request:
    paths: ['src/**', 'tests/**', 'pyproject.toml', '.github/workflows/build.yml', 'data/snapshots/portfolio_sma_inputs.zip', 'reports/portfolio_sma_manifest.json', 'data/snapshots/sma_price_inputs.zip', 'reports/sma_price_input_manifest.json']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Rebuild portfolio and SMA analysis offline
        run: longrun-leverage-analysis --offline
      - name: Rebuild SMA falsification battery offline
        run: longrun-leverage-falsification --offline
      - name: Rebuild capital reserve experiment offline
        run: |
          longrun-leverage-reserve --offline
          PYTHONPATH=src python -m letf.reserve_cohorts
      - name: Rebuild canonical price-only signal revision
        run: PYTHONPATH=src python -m letf.price_signal_revision
      - name: Download sources and generate outputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          longrun-leverage --refresh
          longrun-leverage-analysis --refresh
          longrun-leverage-falsification --offline
          PYTHONPATH=src python -m letf.price_signal_revision
      - uses: actions/upload-artifact@v4
        with:
          name: longrun-leverage-timeseries
          path: |
            data/processed/
            reports/
            config.json
          retention-days: 90
