[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longrun-leverage"
version = "0.1.0"
description = "Daily leveraged ETF reconstruction with chronological validation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "matplotlib>=3.8"]

[project.scripts]
longrun-leverage = "letf.pipeline:main"
longrun-leverage-analysis = "letf.analysis:main"

[tool.setuptools.packages.find]
where = ["src"]
